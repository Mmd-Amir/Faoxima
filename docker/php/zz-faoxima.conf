[global]
error_log = /var/www/faoxima/logs/php-fpm-error.log
log_level = notice

[www]
access.log = /var/www/faoxima/logs/php-fpm.log
access.format = "%{%Y-%m-%dT%H:%M:%S%z}t request_id=%{HTTP_X_REQUEST_ID}e pid=%p status=%s duration_ms=%{mili}d memory_kb=%M method=%m script=%f"
slowlog = /var/www/faoxima/logs/php-fpm-slow.log
request_slowlog_timeout = 3s
pm.status_path = /fpm-status
catch_workers_output = yes
decorate_workers_output = no
